<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div id="container"></div>

    <!-- Monaco-Editor via CDN laden (für Offline-Szenarien lokal speichern) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/loader.min.js"></script>
    <script>
    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs' } });

    let editor;

    require(['vs/editor/editor.main'], function() {
        editor = monaco.editor.create(document.getElementById('container'), {
            value: [
                '# Schreibe hier deinen Python-Code',
                'def hallo_welt():',
                '    print("Hallo aus Monaco!")',
                ''
            ].join('\n'),
            language: 'python',
            theme: 'vs-dark',
            automaticLayout: true
        });

        // Event-Handler für Inhaltsänderungen im Editor
        editor.onDidChangeModelContent(() => {
            const code = editor.getValue();
            // Sendet den geänderten Code zurück an C#
            window.chrome.webview.postMessage(code);
        });
    });

    // Funktion, die von C# aufgerufen wird, um neuen Code zu setzen
    function setCode(newCode) {
        if (editor && editor.getValue() !== newCode) {
            editor.setValue(newCode);
        }
    }
    </script>
</body>
</html>
